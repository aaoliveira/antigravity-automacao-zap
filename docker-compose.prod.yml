services:
  # ============================================================================
  # 1. BANCO DE DADOS RELACIONAL (POSTGRESQL 16) - ISOLADO INTERNAMENTE
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: zap_prod_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - zap_prod_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - zap_prod_internal
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ============================================================================
  # 2. FILAS E CACHE DISTRIBUÍDO (REDIS 7) - ISOLADO INTERNAMENTE
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: zap_prod_redis
    restart: always
    command: redis-server --appendonly yes --requirepass "${REDIS_PASSWORD}"
    volumes:
      - zap_prod_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - zap_prod_internal
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ============================================================================
  # 3. PROVISIONAMENTO DO BANCO DA EVOLUTION API (ISOLADO)
  # ============================================================================
  evolution-db-init:
    image: postgres:16-alpine
    container_name: zap_prod_evolution_db_init
    restart: "no"
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        psql -h postgres -U "${POSTGRES_USER}" -d "${POSTGRES_DB}" -tc "SELECT 1 FROM pg_database WHERE datname = '${EVOLUTION_DB_NAME:-evolution_api}'" | grep -q 1 || psql -h postgres -U "${POSTGRES_USER}" -d "${POSTGRES_DB}" -c "CREATE DATABASE \"${EVOLUTION_DB_NAME:-evolution_api}\""
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - zap_prod_internal

  # ============================================================================
  # 4. GATEWAY WHATSAPP (EVOLUTION API V2) - ISOLADO INTERNAMENTE
  # ============================================================================
  evolution-api:
    image: evoapicloud/evolution-api:v2.3.7
    container_name: zap_prod_evolution_api
    restart: always
    environment:
      DOCKER_ENV: 'true'
      SERVER_NAME: evolution
      SERVER_TYPE: http
      SERVER_PORT: 8080
      SERVER_URL: https://${DOMAIN}
      AUTHENTICATION_TYPE: apikey
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: 'true'
      DATABASE_ENABLED: 'true'
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${EVOLUTION_DB_NAME:-evolution_api}?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: zap_evolution_prod
      DATABASE_SAVE_DATA_INSTANCE: 'true'
      DATABASE_SAVE_DATA_NEW_MESSAGE: 'false'
      DATABASE_SAVE_MESSAGE_UPDATE: 'false'
      DATABASE_SAVE_DATA_CONTACTS: 'false'
      DATABASE_SAVE_DATA_CHATS: 'true'
      DATABASE_SAVE_DATA_LABELS: 'false'
      DATABASE_SAVE_DATA_HISTORIC: 'false'
      DATABASE_SAVE_IS_ON_WHATSAPP: 'false'
      DATABASE_DELETE_MESSAGE: 'true'
      CACHE_REDIS_ENABLED: 'true'
      CACHE_REDIS_URI: redis://:${REDIS_PASSWORD}@redis:6379/6
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_REDIS_TTL: 604800
      CACHE_REDIS_SAVE_INSTANCES: 'false'
      CACHE_LOCAL_ENABLED: 'false'
      DEL_INSTANCE: 'false'
      CONFIG_SESSION_PHONE_CLIENT: ZapBuilderProd
      CONFIG_SESSION_PHONE_NAME: Chrome
      CORS_ORIGIN: '*'
      CORS_METHODS: GET,POST,PUT,DELETE
      CORS_CREDENTIALS: 'true'
      LOG_LEVEL: "ERROR,WARN,INFO"
      TELEMETRY_ENABLED: 'false'
      LANGUAGE: pt-BR
    volumes:
      - zap_prod_evolution_instances:/evolution/instances
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      evolution-db-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - zap_prod_internal
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ============================================================================
  # 5. BACKEND API & WORKFLOW ENGINE (NESTJS)
  # ============================================================================
  backend:
    container_name: zap_prod_backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY}
      EVOLUTION_SERVER_URL: http://evolution-api:8080
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      evolution-api:
        condition: service_healthy
    networks:
      - zap_prod_internal
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ============================================================================
  # 6. FRONTEND VISUAL FLOW BUILDER (NEXT.JS 15 STANDALONE)
  # ============================================================================
  frontend:
    container_name: zap_prod_frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://${DOMAIN}
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3001
      NEXT_PUBLIC_API_URL: https://${DOMAIN}
    depends_on:
      backend:
        condition: service_started
    networks:
      - zap_prod_internal
    logging:
      driver: "json-file"
      options:
        max-size: "30m"
        max-file: "5"

  # ============================================================================
  # 7. REVERSE PROXY NGINX (HTTP/HTTPS & SSL TERMINATION)
  # ============================================================================
  nginx:
    image: nginx:alpine
    container_name: zap_prod_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - zap_prod_certbot_etc:/etc/letsencrypt
      - zap_prod_certbot_var:/var/www/certbot
    depends_on:
      - backend
      - frontend
    networks:
      - zap_prod_internal
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ============================================================================
  # 8. CERTBOT - RENOVAÇÃO AUTOMÁTICA DE CERTIFICADOS SSL LET'S ENCRYPT
  # ============================================================================
  certbot:
    image: certbot/certbot:latest
    container_name: zap_prod_certbot
    restart: unless-stopped
    volumes:
      - zap_prod_certbot_etc:/etc/letsencrypt
      - zap_prod_certbot_var:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - zap_prod_internal

volumes:
  zap_prod_pgdata:
    name: zap_prod_pgdata
  zap_prod_redisdata:
    name: zap_prod_redisdata
  zap_prod_evolution_instances:
    name: zap_prod_evolution_instances
  zap_prod_certbot_etc:
    name: zap_prod_certbot_etc
  zap_prod_certbot_var:
    name: zap_prod_certbot_var

networks:
  zap_prod_internal:
    name: zap_prod_internal
    driver: bridge
